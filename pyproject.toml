[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyoz"
version = "0.1.0"
description = "PyOz — Pure Agent Mode Coding Assistant (Warp AI Clone)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["ai", "coding-assistant", "agent", "cli", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development",
]
dependencies = [
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
]

[project.optional-dependencies]
treesitter = ["tree-sitter-languages>=1.10.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
all = [
    "tree-sitter-languages>=1.10.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
pyoz = "pyoz.cli:main"

[project.urls]
Homepage = "https://github.com/akabhinav/warp-ai-clone-cli-agent-python"
Repository = "https://github.com/akabhinav/warp-ai-clone-cli-agent-python"
Issues = "https://github.com/akabhinav/warp-ai-clone-cli-agent-python/issues"

[tool.setuptools.packages.find]
include = ["pyoz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
