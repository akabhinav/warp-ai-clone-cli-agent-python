# PyOz Sandbox — Default Nginx Config
# This config serves static files from /workspace and proxies
# application ports. Modify as needed for your projects.

server {
    listen 80 default_server;
    server_name _;

    # Serve static files from workspace
    location /static/ {
        alias /workspace/static/;
    }

    # Proxy to common app ports
    # Uncomment and modify as needed:

    # Python (FastAPI/Django/Flask)
    # location / {
    #     proxy_pass http://pyoz-agent:8000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    # Node.js (Express/Next.js)
    # location / {
    #     proxy_pass http://pyoz-agent:3000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    # Java (Spring Boot)
    # location / {
    #     proxy_pass http://pyoz-agent:8080;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    # Default: return info page
    location / {
        return 200 '{"status": "PyOz Sandbox Nginx is running. Configure proxy_pass for your app."}';
        add_header Content-Type application/json;
    }
}
